  <!--
    Structured data (2026-10-04): rewritten to match reality. The previous version claimed
    a fake support phone number (+44-20-7123-4567, a placeholder that was never real) and
    referenced a logo.png that doesn't exist in public/ — both dropped rather than left
    broken. Person schema added for the founder (Michal) as a genuine E-E-A-T signal: this
    is software built and written about by a named, real tradesperson, not an anonymous
    "Organization". sameAs social links were unverified claims, also dropped — add back only
    once those accounts are confirmed real and active.
  -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PriceM8",
        "alternateName": "pricem8.uk",
        "url": "https://pricem8.uk/"
      }
    </script>

  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "PriceM8",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "offers": [
          {
            "@type": "Offer",
            "name": "Landscaping",
            "price": "25",
            "priceCurrency": "GBP",
            "description": "Monthly subscription, 14-day free trial, card required to start."
          },
          {
            "@type": "Offer",
            "name": "Garden Rooms",
            "price": "99",
            "priceCurrency": "GBP",
            "description": "One-off add-on purchase, available once subscribed to Landscaping."
          }
        ],
        "description": "Quoting and estimating software for UK landscapers and garden room builders. Automatic material and labour takeoffs, editable prices, and branded PDF quotes and invoices.",
        "author": {
          "@type": "Person",
          "name": "Michal",
          "jobTitle": "Founder",
          "description": "Landscaper and garden room builder with 20 years on the tools, building real jobs since 2005."
        }
      }
    </script>
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PriceM8",
        "url": "https://pricem8.uk",
        "founder": {
          "@type": "Person",
          "name": "Michal"
        }
      }
    </script>
</head>
